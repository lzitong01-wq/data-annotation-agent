[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-annotation-agent"
version = "0.1.0"
description = "通用数据标注智能体：多 Agent 协作完成标注、一致性检验、裁决、复核与反馈闭环"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "李子桐", email = "20251182127@ucass.edu.cn" }]
keywords = [
    "annotation",
    "data-labeling",
    "llm",
    "multi-agent",
    "gradio",
    "quality-control",
    "inter-annotator-agreement",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "gradio>=6.0",
    "openai>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
data-annotation-agent = "data_annotation_agent.ui.app:main"

[project.urls]
Homepage = "https://github.com/lzitong01-wq/data-annotation-agent"
Repository = "https://github.com/lzitong01-wq/data-annotation-agent"
Issues = "https://github.com/lzitong01-wq/data-annotation-agent/issues"
Changelog = "https://github.com/lzitong01-wq/data-annotation-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/data_annotation_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
